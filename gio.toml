[app]
name   = "giojs-app"
router = "app"

[server]
host  = "0.0.0.0"
port  = 3000
http2 = false
# Connection limits (defaults shown; 0 disables any of them):
# max_connections                = 10000
# tls_handshake_timeout_secs     = 10
# header_read_timeout_secs       = 10  # slowloris guard; also the HTTP/1.1 idle timeout
# request_body_timeout_secs      = 30  # slow uploads get 408
# idle_timeout_secs              = 60  # close connections with nothing in flight
# http2_max_concurrent_streams   = 250
# http2_keep_alive_interval_secs = 20
# http2_keep_alive_timeout_secs  = 20

[server.tls]
enabled   = false
cert_path = "./certs/cert.pem"
key_path  = "./certs/key.pem"

[cache]
memory_mb = 50
disk_path = ".gio/cache"

[cache.redis]
enabled = false
url     = "redis://localhost:6379"
prefix  = "gio:"

[compression]
enabled       = true
min_size_bytes = 1024
prefer_brotli = true

[prefetch]
strategy       = "hover"
max_concurrent = 5
max_per_second = 20

[images]
allowed_widths = [640, 750, 828, 1080, 1200, 1920]
quality        = 75
formats        = ["webp", "avif"]

[css]
engine              = "lightning"
minify              = true
critical_extraction = true
