#:schema ./packages/giojs/gio.schema.json
# The example configuration: every section GioJS reads, with its defaults.
# In an app, point editors at the schema the server package ships:
#   #:schema ./node_modules/@gio.js/server/gio.schema.json
# Unknown keys stop the server at startup; tables named [x-...] are left for
# other tools. Reference: https://giojs.com/docs/configuration

[app]
name   = "giojs-app"
router = "app"

[server]
host  = "0.0.0.0"   # GIO_HOST overrides
port  = 3000        # GIO_PORT, then PORT (set by most hosting platforms), override
http2 = false
# Connection limits (defaults shown; 0 disables any of them):
# max_connections                = 10000
# tls_handshake_timeout_secs     = 10
# header_read_timeout_secs       = 10  # slowloris guard; also the HTTP/1.1 idle timeout
# request_body_timeout_secs      = 30  # slow uploads get 408
# idle_timeout_secs              = 60  # close connections with nothing in flight
# http2_max_concurrent_streams   = 250
# http2_keep_alive_interval_secs = 20
# http2_keep_alive_timeout_secs  = 20

[server.tls]
enabled   = false
cert_path = "./certs/cert.pem"
key_path  = "./certs/key.pem"

[cache]
memory_max_entries = 1000                # pages kept in memory
disk_path          = ".gio/cache/pages"  # GIO_CACHE_DIR overrides
disk_max_bytes     = 536870912           # 512 MiB; 0 = unbounded

[compression]
enabled        = true
min_size_bytes = 1024
prefer_brotli  = true

[prefetch]
max_concurrent = 5    # per client
max_per_second = 20   # per client

[images]
allowed_widths = [640, 750, 828, 1080, 1200, 1920]
quality        = 75
formats        = ["avif", "webp"]

[css]
minify              = true
critical_extraction = true

[dev]
# Files the app writes into the project that must not restart the worker:
# watch_ignore = ["data/**", "*.db"]
