[app]
name = "integration-fixture"

[server]
host  = "127.0.0.1"
port  = 39517
http2 = false

[[redirects]]
from   = "/moved"
to     = "/cached"
status = 301

# Exact-path rule the integration tests try to dodge with path spellings.
[[rate_limits]]
path           = "/api/limited"
per_ip         = 2
window_seconds = 3600
burst          = 0
