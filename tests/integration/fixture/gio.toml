[app]
name = "integration-fixture"

[server]
host  = "127.0.0.1"
port  = 39517
http2 = false
# Tiny connection deadlines keep the slowloris / slow-body tests fast.
header_read_timeout_secs  = 2
request_body_timeout_secs = 2

[[redirects]]
from   = "/moved"
to     = "/cached"
status = 301

# Exact-path rule the integration tests try to dodge with path spellings.
[[rate_limits]]
path           = "/api/limited"
per_ip         = 2
window_seconds = 3600
burst          = 0

# Rules written for a public/ file's /public/... URL also cover the root URL
# it is served at; redirects stay about the URL that was requested.
[[guards]]
path           = "/public/members/*rest"
require_cookie = "session"
redirect_to    = "/login"

# Session guards verify the gio_session token's MAC and expiry in Rust.
[[guards]]
path            = "/api/me"
require_session = true
redirect_to     = "/login"

[[headers]]
path = "/public/members/*rest"
[headers.headers]
x-robots-tag = "noindex"

[[redirects]]
from   = "/public/moved-root/*rest"
to     = "/moved-root/*rest"
status = 301

[[rate_limits]]
path           = "/public/limited/*"
per_ip         = 2
window_seconds = 3600
burst          = 0
