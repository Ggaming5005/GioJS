#:schema ./node_modules/@gio.js/server/gio.schema.json
[app]
name = "{{PROJECT_NAME}}"

[server]
host = "0.0.0.0"
port = 3000   # the PORT or GIO_PORT env var overrides it
http2 = true

[images]
allowed_widths = [640, 828, 1080, 1200, 1920]
quality = 80

# Self-hosted fonts: copied from public/fonts/ at every start, served from
# /_gio/fonts/ and preloaded on every page - no third-party font CDN. One
# entry per file; a url may also be an https:// .woff2 (downloaded once).
[[fonts]]
family = "Fraunces"
url = "/public/fonts/fraunces-400-normal.woff2"

[[fonts]]
family = "Fraunces"
url = "/public/fonts/fraunces-400-italic.woff2"
style = "italic"

[[fonts]]
family = "JetBrains Mono"
url = "/public/fonts/jetbrains-mono-400-normal.woff2"

[[fonts]]
family = "JetBrains Mono"
url = "/public/fonts/jetbrains-mono-600-normal.woff2"
weight = 600
