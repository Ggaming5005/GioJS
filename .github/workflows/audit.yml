name: Security audit

# New advisories land against dependencies nobody touched, so on pull requests
# CI only annotates them (see ci.yml). This weekly run is where they fail
# loudly: a red scheduled run notifies the maintainers without blocking
# unrelated PRs, and the fix is a Cargo.lock / pnpm-lock.yaml bump.
# It is also the only cargo-deny run where an unmaintained direct dependency
# is an error - CI and release pass `--warn unmaintained` (see deny.toml).

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --all-features --locked

  npm-audit:
    name: pnpm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: pnpm audit --prod --audit-level=high
