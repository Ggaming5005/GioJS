name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Every publishable package, platform pin, and template range must carry the
  # same version - a beta-N wrapper resolving beta-M binaries is protocol
  # drift waiting to happen.
  version-lockstep:
    name: Version lockstep check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sync-versions.mjs --check

  # A tag from a red commit must not publish. These mirror ci.yml - tag pushes
  # do not trigger the CI workflow, so the release runs its own gate.
  rust-tests:
    name: Rust tests + clippy (${{ matrix.os }})
    needs: version-lockstep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  node-tests:
    name: Node tests + typecheck
    needs: version-lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: giojs-core tests + typecheck
        working-directory: packages/giojs-core
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: giojs-react tests + typecheck
        working-directory: packages/giojs-react
        run: |
          npx tsc --noEmit
          npx vitest run

  integration:
    name: Integration (${{ matrix.os }})
    needs: version-lockstep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p giojs-server
      - run: node tests/integration/run.mjs

  build-platform:
    name: Build ${{ matrix.pkg }}
    needs: [rust-tests, node-tests, integration]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  pkg: giojs-linux-x64,      cross: false }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, pkg: giojs-linux-x64-musl, cross: false }
          # linux-arm64 (aarch64 cross-compile) deferred - fails to build under `cross`; re-add once fixed
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    pkg: giojs-win32-x64,      cross: false }
          # Intel Mac binary is cross-compiled on the arm64 runner: the macos-13
          # (Intel) hosted pool is being retired and queues for hours. Apple's
          # clang cross-compiles x86_64 natively, so macos-14 builds both.
          - { os: macos-14,       target: x86_64-apple-darwin,       pkg: giojs-darwin-x64,     cross: false }
          - { os: macos-14,       target: aarch64-apple-darwin,      pkg: giojs-darwin-arm64,   cross: false }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p giojs-server

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p giojs-server

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/giojs-server platform/${{ matrix.pkg }}/bin/giojs-server
          chmod +x platform/${{ matrix.pkg }}/bin/giojs-server

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\giojs-server.exe platform\${{ matrix.pkg }}\bin\giojs-server.exe

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tarball contains the binary
        shell: bash
        run: node scripts/check-tarballs.mjs platform/${{ matrix.pkg }}

      - name: Publish platform package (skip if already published)
        shell: bash
        run: |
          dir="./platform/${{ matrix.pkg }}"
          name=$(node -p "require('$dir/package.json').name")
          ver=$(node -p "require('$dir/package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "✓ $name@$ver already on npm - skipping"
          else
            npm publish "$dir" --access public --tag beta --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main:
    name: Publish @gio.js/* + create-giojs
    needs: build-platform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # giojs-react and create-giojs publish compiled dist/ that is not in git.
      # Skipping this build is how @gio.js/react@0.1.0-beta.5 shipped empty.
      - run: pnpm install --frozen-lockfile

      - name: Build publishable dist/
        run: |
          pnpm --filter @gio.js/react run build
          pnpm --filter create-giojs run build

      # Refuse to publish any tarball whose entry points are missing.
      - name: Verify tarball contents
        run: node scripts/check-tarballs.mjs packages/giojs-react packages/giojs-core packages/giojs packages/giojs-cli

      # Publish in dependency order, skipping any version already on npm
      # (so re-runs and partial releases are idempotent).
      - name: Publish @gio.js/* + create-giojs
        shell: bash
        run: |
          set -e
          for dir in packages/giojs-react packages/giojs-core packages/giojs packages/giojs-cli; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "✓ $name@$ver already on npm - skipping"
            else
              echo "publishing $name@$ver"
              npm publish "./$dir" --access public --tag beta --provenance
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Point `latest` at this release so a plain `npm install @gio.js/*` and
      # `npm create giojs@latest` get it. The whole project is pre-1.0, so
      # `latest` should track the newest release. Platform binary packages are
      # promoted too - leaving them behind pins `latest` installs to stale
      # binaries. Uses the automation token (the packages require a 2FA or
      # automation token for writes).
      - name: Move latest to this release
        shell: bash
        run: |
          set -e
          ver=$(node -p "require('./packages/giojs/package.json').version")
          pkgs="@gio.js/server @gio.js/core @gio.js/react create-giojs"
          for dir in platform/*/; do
            pkgs="$pkgs $(node -p "require('./$dir/package.json').name")"
          done
          # Freshly published versions can lag registry reads by up to a
          # minute; retry instead of silently skipping (beta.6 shipped with
          # latest still on beta.5 because of exactly this race).
          for pkg in $pkgs; do
            promoted=false
            for attempt in 1 2 3 4 5 6; do
              if npm view "$pkg@$ver" version >/dev/null 2>&1; then
                npm dist-tag add "$pkg@$ver" latest
                echo "$pkg@$ver -> latest"
                promoted=true
                break
              fi
              echo "  $pkg@$ver not visible yet (attempt $attempt) - waiting"
              sleep 10
            done
            if [ "$promoted" = false ]; then
              echo "skip: $pkg@$ver never became visible - promote manually via promote-latest.yml"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
