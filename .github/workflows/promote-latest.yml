name: Promote latest

# Moves the npm `latest` dist-tag to the current release version for the
# published @gio.js/* packages and create-giojs. Runs on demand. Uses the
# automation NPM_TOKEN, which satisfies the packages' "require 2FA or
# automation token" write policy (an interactive-login token does not).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote to latest (blank = read from packages/giojs/package.json)'
        required: false
        default: ''

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Move latest to the release version
        shell: bash
        run: |
          ver="${{ github.event.inputs.version }}"
          if [ -z "$ver" ]; then
            ver=$(node -p "require('./packages/giojs/package.json').version")
          fi
          echo "Promoting latest -> $ver"
          pkgs="@gio.js/server @gio.js/core @gio.js/react create-giojs"
          for dir in platform/*/; do
            pkgs="$pkgs $(node -p "require('./$dir/package.json').name")"
          done
          for pkg in $pkgs; do
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              npm dist-tag add "$pkg@$ver" latest
              echo "  $pkg@$ver -> latest"
            else
              echo "  skip: $pkg@$ver not on npm"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
