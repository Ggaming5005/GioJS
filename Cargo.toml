[workspace]
members = [
  "crates/giojs-server",
  "crates/giojs-router",
  "crates/giojs-assets",
  "crates/giojs-cache",
  "crates/giojs-prefetch",
  "crates/giojs-ratelimit",
  "crates/giojs-i18n",
  "crates/giojs-font",
  "crates/giojs-image",
  "crates/giojs-css",
  "crates/giojs-plugin",
  # "crates/giojs-compress",
  # "crates/giojs-middleware",
  # "crates/giojs-og",
]
resolver = "2"

# Minimum supported Rust version, inherited by every crate above
# (`rust-version.workspace = true`). It is the highest `rust-version` a crate
# in Cargo.lock needs, so a dependency bump can raise it. The CI `msrv` job
# checks the workspace with exactly this toolchain, and
# scripts/check-msrv.mjs keeps it, Cargo.lock and the Rust image in
# docs/deployment/docker.md in step.
[workspace.package]
rust-version = "1.89"

[workspace.dependencies]
tokio              = { version = "1",    features = ["full"] }
axum               = { version = "0.7", features = ["ws", "macros"] }
tower              = "0.4"
tower-http         = { version = "0.6", features = ["fs", "trace", "set-header", "compression-br", "compression-gzip"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid               = { version = "1",    features = ["v4"] }
tokio-util         = { version = "0.7", features = ["codec"] }
bytes              = "1"
toml               = "0.8"
thiserror          = "1"
dashmap            = "5"
anyhow             = "1"
sha2               = "0.10"
# Session-cookie verification for require_session guards (HMAC + HKDF over sha2).
hmac               = "0.12"
hkdf               = "0.12"
lru                = "0.12"
tokio-stream       = { version = "0.1", features = ["sync"] }
# default-features=false drops reqwest's native-tls (OpenSSL) backend, which
# has no musl build and broke the Alpine target. rustls-tls is the only TLS
# backend; http2 + charset restore the useful defaults we still want.
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
hyper              = { version = "1", features = ["server", "http1", "http2"] }
hyper-util         = { version = "0.1", features = ["tokio", "server-auto"] }
lightningcss       = { version = "1.0.0-alpha.71", features = ["bundler"] }
# .env loading at server startup (parser semantics shared with core env-files.ts).
dotenvy            = "0.15"
